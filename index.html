      '<b>Arena made easy:</b> open Battlefield › Battle Log › Arena once (50 per page) with the script or the button running. That list alone is enough for every opponent already seen in a squadron battle; View battle is only needed for players never met there.': '<b>Arena, más fácil:</b> abre Campo de batalla › Registro de peleas › Arena una vez (50 por página) con el script o el botón en marcha. Esa lista basta para todos los rivales ya vistos en una batalla de escuadrón; Ver pelea solo hace falta para jugadores nunca vistos ahí.',

      '<b>Plan against:</b> choose the meta field, all your recorded duels, one player or one squadron. The <b>Current</b>, <b>Best build</b> and <b>Upgrades</b> tabs answer for that choice.': '<b>Planificar contra:</b> elige el meta, todos tus duelos guardados, un jugador o un escuadrón. Las pestañas <b>Actual</b>, <b>Mejor build</b> y <b>Mejoras</b> responden a esa elección.',

      'This page plans your PvP build and your squadron groups. First bring in your data, in one of these ways:': 'Esta página planifica tu build JcJ y los grupos de tu escuadrón. Primero trae tus datos, de una de estas formas:',
      'Then:': 'Después:',
      'Nothing here acts in the game or changes anything in it. The only thing sent anywhere is Load my build, which reads your account through the game\'s official read-only API with your own key. The game rules allow tools for information only. Your data stays in this browser.': 'Nada de esto actúa en el juego ni cambia nada en él. Lo único que se envía es Cargar mi build, que lee tu cuenta mediante la API oficial de solo lectura del juego con tu propia clave. Las reglas del juego permiten herramientas solo informativas. Tus datos se quedan en este navegador.',
      'Your key is sent only to the game\'s own public API, straight from this browser. Each load uses {0} of your {1} daily calls to /user; a load within {2} minutes reuses the last answer for free.': 'Tu clave solo se envía a la API pública del propio juego, directamente desde este navegador. Cada carga usa {0} de tus {1} llamadas diarias a /user; una carga en menos de {2} minutos reutiliza la última respuesta gratis.',
      'It brings your own squadron battles and arena duels here without installing anything. Like the script, it only reads what the game shows you: it sends nothing to the game and clicks nothing. It works in a web browser such as Chrome, Edge or Firefox (not inside the Steam app).': 'Trae aquí tus batallas de escuadrón y duelos de arena sin instalar nada. Como el script, solo lee lo que el juego te muestra: no envía nada al juego ni hace clic en nada. Funciona en un navegador web como Chrome, Edge o Firefox (no dentro de la app de Steam).',
      'Cannot use bookmarks? On the game page press F{0}, open the Console tab, paste the code (button below) and press Enter. Chrome asks you to type "allow pasting" the first time. Then steps {1} and {2}.': '¿No puedes usar marcadores? En la página del juego pulsa F{0}, abre la pestaña Consola, pega el código (botón de abajo) y pulsa Intro. La primera vez Chrome te pide escribir "allow pasting". Después, los pasos {1} y {2}.',
      'Reloading the game tab ends it: click the bookmark again next time.': 'Al recargar la pestaña del juego se detiene: pulsa el marcador otra vez la próxima vez.',

  /* ============================================================
     PvP Build Planner (web page)

     The player pastes their own API key; the page asks the game's public
     API for their account (/api/public/user, 1 call of the 50 a day) and
     runs Astrolabe's PvP planner on it: the meta split at their own total
     stat, the best free re-spec, and which upgrades pay. The planner is
     Astrolabe's own code, copied unchanged by a build step.

     The key goes from this browser to the game's API and nowhere else. It
     is only kept on this device when the player ticks "Remember".
     ============================================================ */

  var store = {
    get: function (k, d) {
      try { var r = localStorage.getItem('sopvpweb:' + k); return r === null ? d : JSON.parse(r); } catch (e) { return d; }
    },
    set: function (k, v) {
      try { if (v === null || v === undefined) localStorage.removeItem('sopvpweb:' + k); else localStorage.setItem('sopvpweb:' + k, JSON.stringify(v)); } catch (e) {}
    }
  };

  var PVP_DEFAULTS = { keepBadges: 0, bestGap: 2 };
  var S = {
    inputs: Object.assign({}, PVP_DEFAULTS, store.get('inputs', {})),
    battles: [],          // the API has no duel history: the plan is against the meta field
    storeOk: false, storeState: null,
    lastErr: null, lastErrAt: 0, wkFail: null, wkLast: null
  };
  function setErr(msg) { S.lastErr = msg || null; S.lastErrAt = msg ? Date.now() : 0; }
  function saveInputs() { store.set('inputs', S.inputs); }

  var REALMS = { steam: 'https://steamapi.stellarodyssey.app', web: 'https://api.stellarodyssey.app' };

  /* ---- the background worker: only the planner ---- */
  function WK_VARS() {

  /* ============================================================
     SQUADRON BATTLE SIMULATOR (1.2.0)

       - one member per side fights at a time, with all its clones; the
         defending side's member acts first each round;
       - when a member's last clone dies, the next member of that group
         steps in at once, inside the same phase, and the remaining clones
         of the attacker carry on against it;

         precision and evasion are x(1 - 0.2 x 1.25^(k-1)), at most -90%,
         replacing (not compounding) the last one;

  /* ============================================================
