      'Nothing here acts in the game or changes anything in it. The only thing sent anywhere is Load my build, which reads your account through the game\'s official read-only API with your own key. The game rules allow tools for information only. Your data stays in this browser.': 'Nada de esto actúa en el juego ni cambia nada en él. Lo único que se envía es Cargar mi build, que lee tu cuenta mediante la API oficial de solo lectura del juego con tu propia clave. Las reglas del juego permiten herramientas solo informativas. Tus datos se quedan en este navegador.',

      'It brings your own squadron battles and arena duels here without installing anything. Like the script, it only reads what the game shows you: it sends nothing to the game and clicks nothing. It works in a web browser such as Chrome, Edge or Firefox (not inside the Steam app).': 'Trae aquí tus batallas de escuadrón y duelos de arena sin instalar nada. Como el script, solo lee lo que el juego te muestra: no envía nada al juego ni hace clic en nada. Funciona en un navegador web como Chrome, Edge o Firefox (no dentro de la app de Steam).',

  /* ============================================================
     PvP Build Planner (web page)

     The player pastes their own API key; the page asks the game's public
     API for their account (/api/public/user, 1 call of the 50 a day) and
     runs Astrolabe's PvP planner on it: the meta split at their own total
     stat, the best free re-spec, and which upgrades pay. The planner is
     Astrolabe's own code, copied unchanged by a build step.

     The key goes from this browser to the game's API and nowhere else. It
     is only kept on this device when the player ticks "Remember".
     ============================================================ */

  var store = {
    get: function (k, d) {
      try { var r = localStorage.getItem('sopvpweb:' + k); return r === null ? d : JSON.parse(r); } catch (e) { return d; }
    },
    set: function (k, v) {
      try { if (v === null || v === undefined) localStorage.removeItem('sopvpweb:' + k); else localStorage.setItem('sopvpweb:' + k, JSON.stringify(v)); } catch (e) {}
    }
  };

  var PVP_DEFAULTS = { keepBadges: 0, bestGap: 2 };
  var S = {
    inputs: Object.assign({}, PVP_DEFAULTS, store.get('inputs', {})),
    battles: [],          // the API has no duel history: the plan is against the meta field
    storeOk: false, storeState: null,
    lastErr: null, lastErrAt: 0, wkFail: null, wkLast: null
  };
  function setErr(msg) { S.lastErr = msg || null; S.lastErrAt = msg ? Date.now() : 0; }
  function saveInputs() { store.set('inputs', S.inputs); }

  var REALMS = { steam: 'https://steamapi.stellarodyssey.app', web: 'https://api.stellarodyssey.app' };

  function WK_VARS() {
    return {
      AR_ASSUME: AR_ASSUME, AR_SPREAD: AR_SPREAD, CLONE_CRIT_BASE: CLONE_CRIT_BASE, PVP_HP_MULT: PVP_HP_MULT, PVP_SKILLS: PVP_SKILLS, PVP_STATS: PVP_STATS,

      PV_SEARCH_MAX: PV_SEARCH_MAX, PV_SEED: PV_SEED, PV_SIMS: PV_SIMS,

    };

    return [numOr, btRng, arAssume, arDraws, arSide, pvAllocate, pvBestAssign, pvClimb, pvKeepGear, pvCompositions, pvCopy, pvGap, pvGearBase, pvGearVal, pvLevelCost,
      pvMetaPool, pvNeedFor, pvPlanRun, pvPool, pvPoolRef, pvReplay, pvSample, pvScore, pvScoreOf, pvSkills, pvSpend, pvTerm,
      pvTierCost, pvTotals, pvUpgradeRows, rlDuel, rlLeft, rlLoad, rlMe, rlPhase, rlSlot, rngStreams,
      sqDebuff, sqFloor, sqSide, sqEnter, sqHealth, sqLeft, sqPhase, sqFight, gbNorm, gbDraw, gbGroup, gbPerms, gbStr, gbOrder, gbOptimise];
  }
  function wkMain() {
    self.onmessage = function (e) {
      var job = e.data;
      try {
        if (job.kind === 'gb') {
          var res = gbOptimise(job.pool, job.start, job.enemies, job.opt, function (t) { self.postMessage({ type: 'prog', t: t }); });
          self.postMessage({ type: 'gb', res: res });
          self.postMessage({ type: 'done' });
          return;
        }
        if (job.kind === 'gbt') {
          var one = function (G) { return gbGroup(G, job.enemies, job.sims, job.seed); };
          self.postMessage({ type: 'gbt', res: { mine: job.mine.map(one), now: job.now.map(one) } });
          self.postMessage({ type: 'done' });
          return;
        }
        pvPlanRun(job.pv, job.recs, job.keep, function (plan, err) {
          self.postMessage({ type: 'plan', plan: plan || null, err: err ? String((err && err.message) || err) : null });
          self.postMessage({ type: 'done' });
        });
      } catch (err) {

      }

  /* ---- from the API's account snapshot to the shape the planner reads ----
     The planner reads the game page's stores (UserStore.player.pvp_gear and
     so on). The API's /user carries the same data, but pvp_gear is not
     described in its docs, so it is read leniently: a list, or an object
     keyed by piece. What could not be found is listed under the plan. */
  function findKey(o, re) {
    if (!o || typeof o !== 'object') return undefined;
    for (var k in o) if (re.test(k)) return o[k];

    var gear = gearList(d.pvp_gear).map(function (g) {
      return {

        skill: String(pick1(g, ['skill']) || '').toLowerCase(),
        statLevel: pick1(g, ['statLevel', 'level']),
        statTier: pick1(g, ['statTier', 'tier']),

    if (!gear.length) apiNotes.push('No PvP gear found in the answer (pvp_gear: ' + (d.pvp_gear ? Object.keys(d.pvp_gear).slice(0, 6).join(', ') || 'empty' : 'missing') + ').');

  function metaGear(pv, frac) {
    var n = pv.gear.length, total = Math.pow(PVP_STATS.length, n), best = null;

    'button.sec,label.sec{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:8px 14px;font:inherit;cursor:pointer}',
    'button.sec:hover,label.sec:hover{border-color:var(--ac);color:var(--ac)}',
    '#status{margin:12px 2px;font-size:12px;color:var(--mu)}#status.bad{color:var(--bad)}#status.good{color:var(--good)}',
    '#out{margin-top:6px}',
    '.foot{color:var(--mu);font-size:11px;margin-top:22px;line-height:1.5}',
    '.beta{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;vertical-align:middle;padding:2px 7px;border-radius:6px;border:1px solid var(--ac);color:var(--ac);margin-left:4px}',
    '.sqgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.sqcol{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px}.sqcol h4{margin:0 0 6px}.sqcol select{width:100%;max-width:100%}.sqcol .sqmb select{width:auto}.chips{display:flex;flex-wrap:wrap;gap:4px;margin:3px 0}.chip{background:var(--tile);border:1px solid var(--bd);border-radius:5px;padding:1px 6px;font-size:11px;white-space:nowrap}.sqm{background:var(--tile);border:1px solid var(--bd);border-radius:8px;padding:8px;margin-bottom:6px}.sqm .chip{background:var(--card)}.sqmh{display:flex;align-items:center;gap:6px;margin-bottom:4px}.sqmh b{flex:1}.sqdel{background:none;border:none;color:var(--bad);cursor:pointer;font-size:14px;padding:0 4px}.sqmb{display:flex;flex-direction:column;gap:4px}.sqmb label{white-space:nowrap;font-size:11px}.page a{color:var(--ac)}',
    'a.grab{display:inline-block;padding:4px 10px;border:1px dashed var(--ac);border-radius:7px;color:var(--ac);font-weight:700;text-decoration:none;cursor:grab}',
    '.how summary{cursor:pointer;font-size:14px}.how ol{margin:6px 0 8px 18px;padding:0}.how li,.box ol li{margin:5px 0;line-height:1.45;font-size:12.5px}#grabbox ol{margin:6px 0 6px 18px;padding:0}',
    '.pick tbody tr{cursor:pointer}.pick tbody tr:hover td{background:rgba(127,160,200,.12)}',
    '.filebtn{position:relative;overflow:hidden;display:inline-block}.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}',
    '@media (max-width:520px){.form{grid-template-columns:1fr}.tiles{grid-template-columns:1fr 1fr}table.t{font-size:11px}table.t td,table.t th{padding:4px 5px}}'
  ].join('');

  var dark = store.get('theme', null);
  if (dark !== 'light') dark = 'dark';   // dark unless light was picked

  var cssEl = document.createElement('style'); cssEl.textContent = CSS + PAGE_CSS; document.head.appendChild(cssEl);
  var root = document.createElement('div');
  document.body.appendChild(root);
  function applyTheme() { root.className = 'root ' + dark; document.body.className = dark === 'dark' ? 'dk' : ''; }
  applyTheme();

  var savedKey = store.get('key', '') || '';
  var B = function (k, cls) { return '<div class="line' + (cls ? ' ' + cls : '') + '">' + t(k) + '</div>'; };
  var SCRIPT_URL = 'https://raw.githubusercontent.com/JohnnyBoyQC/stellar-odyssey-pvp-planner/main/pvp-meta.user.js';
  var firstVisit = !store.get('seen', false); store.set('seen', true);
  root.innerHTML =
    '<div class="page">' +
    '<div class="hd"><h1>⚔ PvP Build Planner <span class="beta">beta</span></h1><span class="sub">' + esc(t('for Stellar Odyssey · fan-made')) + ' · v' + esc(PAGE_VER) + '</span><span class="sp"></span>' + langPick() + '<span class="g" id="theme">◐ ' + esc(t('theme')) + '</span></div>' +
    // How to use
    '<details class="box how" id="howto"' + (firstVisit ? ' open' : '') + '><summary><b>' + esc(t('How to use')) + '</b></summary>' +
    B('This page plans your PvP build and your squadron groups. First bring in your data, in one of these ways:') +
    '<ol>' +
    '<li>' + t('<b>Your build only:</b> in the game open Profile › Game API, copy your key, paste it below and click <b>Load my build</b>. The plan is then against the usual meta builds.') + '</li>' +
    '<li>' + t('<b>Everything, automatically (best):</b> install <a href="https://www.tampermonkey.net/" target="_blank" rel="noopener">Tampermonkey</a>, then <a href="{0}" target="_blank" rel="noopener">install PvP Meta</a>. In the game, open Battlefield › Battle Log › Squadron, set 50 per page and click through every page once; open Squadron Groups; click View battle on your arena duels. Then click <b>⚔ PvP Meta › Open in planner ↗</b>: this page opens with everything loaded. From then on it keeps what you browse by itself.', [SCRIPT_URL]) + '</li>' +
    '<li>' + t('<b>Without installing anything:</b> use the <b>PvP Planner button</b> (under "Your duels and squadron battles" below). It works the same way, for one visit.') + '</li>' +
    '<li>' + t('<b>From a squadmate:</b> someone with PvP Meta clicks <b>Save a share file</b> and posts it in your squadron chat; load it with <b>Load file</b>. It holds the squadron battles and roster, not your own arena duels.') + '</li>' +
    '</ol>' +
    B('Then:') +
    '<ol>' +
    '<li>' + t('<b>Plan against:</b> choose the meta field, all your recorded duels, one player or one squadron. The <b>Current</b>, <b>Best build</b> and <b>Upgrades</b> tabs answer for that choice.') + '</li>' +
    '<li>' + t('<b>Squadron groups:</b> untick who will not play, tick up to 3 enemy groups, click <b>Build the best groups</b>. You get the groups in fight order, the win chance against each enemy group, and text to paste in chat. Change the groups yourself in the game.') + '</li>' +
    '</ol>' +
    B('Nothing here acts in the game or changes anything in it. The only thing sent anywhere is Load my build, which reads your account through the game\'s official read-only API with your own key. The game rules allow tools for information only. Your data stays in this browser.', 'mu') +
    '</details>' +
    '<div class="box" style="margin-top:12px">' +
    '<div class="form">' +
    '<label>' + esc(t('Realm')) + '<select id="f_realm"><option value="steam">Steam</option><option value="web">Web</option></select></label>' +
    '<label>' + esc(t('Your API key')) + '<input type="password" id="f_key" autocomplete="off" spellcheck="false" placeholder="' + esc(t('Profile › Game API in the game')) + '"></label>' +
    '</div>' +
    '<div class="btns"><button class="pri" id="b_load">' + esc(t('Load my build')) + '</button><button class="sec" id="b_sample">' + esc(t('Try with sample data')) + '</button>' +
    '<label class="c" style="margin-left:auto"><input type="checkbox" id="f_remember"' + (savedKey ? ' checked' : '') + '>' + esc(t('Remember key on this device')) + '</label></div>' +
    B('Your key is sent only to the game\'s own public API, straight from this browser. Each load uses 1 of your 50 daily calls to /user; a load within 30 minutes reuses the last answer for free.') +
    '</div>' +
    '<div class="box" style="margin-top:16px"><h4 style="margin-top:0">' + esc(t('Your duels and squadron battles')) + '</h4><div id="impstat"></div>' +
    '<div class="btns"><label class="sec filebtn">' + esc(t('Load file (.json)')) + '<input type="file" id="f_arcfile" accept=".json,application/json"></label><button class="sec" id="b_impshare">' + esc(t('Save a share file')) + '</button><button class="sec" id="b_archdl">' + esc(t('Download saved data')) + '</button><button class="sec" id="b_impclr">' + esc(t('Forget imported data')) + '</button></div>' +
    '<details id="grabbox" style="margin-top:10px"><summary style="cursor:pointer;font-weight:600">' + esc(t('No script? Use the PvP Planner button')) + '</summary>' +
    B('It brings your own squadron battles and arena duels here without installing anything. Like the script, it only reads what the game shows you: it sends nothing to the game and clicks nothing. It works in a web browser such as Chrome, Edge or Firefox (not inside the Steam app).') +
    '<ol>' +
    '<li>' + t('Show your bookmarks bar (Ctrl+Shift+B), then drag this button onto it:') + ' <a id="grablink" class="grab" href="#">⚔ PvP Planner</a></li>' +
    '<li>' + t('Open the game in the same browser and click that bookmark. A small PvP Planner box appears in the bottom right corner.') + '</li>' +
    '<li>' + t('In the game, open Battlefield › Battle Log › Squadron, set 50 per page and click through every page; open Squadron Groups; click View battle on each arena duel you want. The box counts what it has kept.') + '</li>' +
    '<li>' + t('Click <b>Send to planner</b> in the box. This page opens with everything loaded. If the browser blocks the new tab, allow pop-ups for the game site and click again.') + '</li>' +
    '</ol>' +
    B('Cannot use bookmarks? On the game page press F12, open the Console tab, paste the code (button below) and press Enter. Chrome asks you to type "allow pasting" the first time. Then steps 3 and 4.', 'mu') +
    '<div class="btns"><button class="sec" id="b_grabcopy">' + esc(t('Copy the code')) + '</button></div>' +
    B('Reloading the game tab ends it: click the bookmark again next time.', 'mu') +
    '</details>' +
    '<div id="impmsg" class="line"></div></div>' +
    '<div id="status"></div>' +
    '<div class="box" style="margin:10px 0 12px"><h4 style="margin-top:0">' + esc(t('Plan against')) + '</h4><div id="vsbody"></div></div>' +
    '<div id="out"></div>' +
    '<div class="box" style="margin-top:16px"><h4 style="margin-top:0">' + esc(t('Squadron groups')) + '</h4><div id="sqbody"></div></div>' +
    '<div class="box" style="margin-top:16px"><h4 style="margin-top:0">' + esc(t('Settings')) + '</h4><div class="grid">' +
    '<label>' + esc(t('Badges to keep')) + '<input type="number" min="0" step="1" id="f_kb" value="' + esc(String(S.inputs.keepBadges)) + '"></label>' +
    '<label>' + esc(t('Least gain worth a change (win %)')) + '<input type="number" min="0" step="any" id="f_gap" value="' + esc(String(S.inputs.bestGap)) + '"></label>' +
    '</div></div>' +
    '<div class="foot">' + esc(t('Unofficial fan tool, not made by the game\'s developers. It only reads your account through the official read-only API; it cannot change anything in the game. The planner is the duel simulator of the Astrolabe userscript: the meta split comes from self-play at equal total stat (35% power, 15% precision, 15% evasion, 35% hull, Block on every piece).')) + '</div>' +
    '</div>';

  i18nStart(root);
  var $ = function (id) { return root.querySelector('#' + id); };
  $('f_lang').addEventListener('change', function () { try { localStorage.setItem('sopvpweb:lang', JSON.stringify($('f_lang').value)); } catch (e) {} location.reload(); });
  var realmEl = $('f_realm'), keyEl = $('f_key'), remEl = $('f_remember'), statusEl = $('status'), out = $('out');
  realmEl.value = store.get('realm', 'steam') === 'web' ? 'web' : 'steam';
  if (savedKey) keyEl.value = savedKey;

  // The planner's own redraw hook and its click targets live in #out.
  var panel = out, tab = 'battle';

  function status(txt, cls) { statusEl.textContent = txt || ''; statusEl.className = cls || ''; }
  function ago(ms) { var m = Math.round((Date.now() - ms) / 60000); return m < 1 ? t('just now') : (m < 90 ? t('{0} min ago', [m]) : (m < 2160 ? t('{0} h ago', [Math.round(m / 60)]) : t('{0} days ago', [Math.round(m / 1440)]))); }
  function keyTag(k) { var h = 0; for (var i = 0; i < k.length; i++) h = (h * 31 + k.charCodeAt(i)) | 0; return String(h); }

  function render() {
    try {
      if (!S.storeState) { out.innerHTML = ''; return; }
      if (!S.storeOk) {
        out.innerHTML = '<div class="box">' + line('Your PvP build could not be read from the answer.', 'bad') + apiNotes.map(function (n) { return line(n, 'warn'); }).join('') + '</div>';
        return;
      }
      var keep = out.scrollTop;
      var pv = readPvp(S.storeState), h = vsFix(renderBattle());
      h += kvs([['Clones', String(pv.N)], ['Gear pieces', String(pv.gear.length)], ['Stat points', grp(pv.pool)], ['PvP badges', grp(pv.badges)], ['Crafting level', String(pv.craft)], ['Velari bonus', '+' + grp(pv.vel)]]);
      h += apiNotes.map(function (n) { return line(n, 'warn'); }).join('');
      if (S.lastErr) h += line(S.lastErr, 'bad');
      out.innerHTML = h;
      out.scrollTop = keep;
      out.querySelectorAll('.seg button').forEach(function (b) {
        b.addEventListener('click', function () { bsub = b.getAttribute('data-sub'); bshow = false; render(); });
      });
      var sb = out.querySelector('#b_showbest');
      if (sb) sb.addEventListener('click', function () { bshow = true; render(); });
    } catch (e) {
      out.innerHTML = line('Drawing failed: ' + ((e && e.message) || e), 'bad');
    }
  }

  function use(rootState, src) {
    S.storeState = rootState;
    S.storeOk = !!readPvp(rootState);
    setErr(null);
    status(S.storeOk ? t('Build loaded ({0}).', [src]) : t('Loaded, but no PvP build in it.'), S.storeOk ? 'good' : 'bad');
    render();
  }

  var loading = false;
  function load() {
    if (loading) return;
    var key = keyEl.value.trim(), realm = realmEl.value;
    store.set('realm', realm);
    if (!key) { status(t('Paste your API key first. In the game: Profile › Game API.'), 'bad'); return; }
    store.set('key', remEl.checked ? key : null);
    // Only the PvP part of the answer is kept, never the whole account.
    var cache = store.get('cache', null);
    if (cache && cache.realm === realm && cache.tag === keyTag(key) && Date.now() - cache.t < 30 * 60000) { apiNotes = cache.notes || []; use(cache.root, t('saved answer from {0}, no call used', [ago(cache.t)])); return; }
    loading = true; $('b_load').disabled = true; status(t('Asking the game\'s API...'));
    fetch(REALMS[realm] + '/api/public/user', { headers: { 'sodyssey-api-key': key } }).then(function (r) {
      return r.text().then(function (t) { var b = null; try { b = JSON.parse(t); } catch (e) {} return { status: r.status, body: b, retry: r.headers.get('retry-after') }; });
    }).then(function (r) {
      if (r.status === 200 && r.body && r.body.data) {
        var rs = apiToRoot(r.body.data);
        store.set('cache', { realm: realm, tag: keyTag(key), t: Date.now(), root: rs, notes: apiNotes });
        use(rs, t('just now'));
      } else if (r.status === 401 || r.status === 403) {
        var msg = (r.body && r.body.msg) || ('HTTP ' + r.status);
        if (r.body && r.body.bannedUntil) status(t('This key is suspended until {0}. Calling before then does nothing.', [new Date(r.body.bannedUntil * 1000).toLocaleString()]), 'bad');
        else status(t('The API refused the key ("{0}"). Check it, and the realm: a Steam key only works with Steam. Stopped without retrying.', [msg]), 'bad');
      } else if (r.status === 429) {
        status(t('Today\'s 50 calls to /user are used up. They come back at 00:00 UTC.') + (r.retry ? ' ' + t('In about {0} h.', [Math.ceil(+r.retry / 3600)]) : '') + ' ' + t('Do not retry before then: rejected calls count too.'), 'bad');
      } else status(t('The API answered HTTP {0}. Try again later.', [r.status]), 'bad');
    }, function (e) {
      status(t('Could not reach the API ({0}).', [(e && e.message) || 'network']), 'bad');
    }).then(function () { loading = false; $('b_load').disabled = false; });
  }

  // A made-up mid-game build, so the page can be tried without a key.
  function sample() {
    apiNotes = [];
    var stats = ['power', 'precision', 'evasion', 'hull'];
    var gear = ['helmet', 'armor', 'weapon', 'shield'].map(function (n, i) {
      return { name: n, stat: stats[i], skill: i ? 'block' : 'dot', statLevel: 12, statTier: 6, statCost: ['iron', 'copper', 'gold', 'silver'][i] };
    });
    use({
      UserStore: { username: 'Sample', pvp_badges: 600, player: { pvp_gear: gear, pvpstats: { available: 40, power: 380, precision: 160, evasion: 60, hull: 260 }, clones: [1, 2, 3, 4].map(function () { return { critical_chance: 12, critical_damage: 25, dual_shot: 6 }; }) } },
      CraftStore: { crafting_level: 15 },
      MaterialsStore: { materialsList: [{ item: { name: 'Iron' }, quantity: 9000 }, { item: { name: 'Copper' }, quantity: 2500 }, { item: { name: 'Gold' }, quantity: 300 }] },
      PetsStore: { petSlots: [], pets: [] }
    }, t('sample data, not your account'));
  }

  $('f_arcfile').addEventListener('change', function () { var f = $('f_arcfile').files[0]; if (f) impFile(f); $('f_arcfile').value = ''; });
  $('b_impshare').addEventListener('click', impShare);
  $('grablink').setAttribute('href', 'javascript:' + encodeURIComponent(GRAB_SRC));
  $('grablink').addEventListener('click', function (e) { e.preventDefault(); impMsg(t('Drag the button to your bookmarks bar, then click it on the game page.'), 'warn'); });
  $('b_grabcopy').addEventListener('click', function () {
    var b = $('b_grabcopy'), ok = function () { b.textContent = t('Copied'); };
    try { navigator.clipboard.writeText(GRAB_SRC).then(ok, function () { impMsg(t('Copying failed: select the code by hand.'), 'bad'); }); } catch (e) { impMsg(t('Copying failed: select the code by hand.'), 'bad'); }
  });
  $('b_impclr').addEventListener('click', function () {
    if (!confirm(t('Forget the imported duels and battles, and everything saved in this browser?'))) return;
    IMP = null; ARCH = null; store.set('imp', null); archPut(); impMsg(''); renderVs(); render();
  });
  $('b_archdl').addEventListener('click', function () { archLoad().then(archDownload); });
  impLoadSaved();
  // Rebuilt from the saved store when the last import was too big for
  // page storage, or was made from the store anyway.
  archLoad().then(function () {
    if (archCount().b + archCount().d === 0) { impStatus(); return; }
    if (!IMP || IMP.src === 'button' || IMP.src === 'file' || IMP.src === 'saved') { try { impExtract(ARCH, 'saved', null, null); } catch (e) {} }
    impStatus();
  });
  if (IMP && IMP.root) use(IMP.root, t('from PvP Meta, {0}', [ago(IMP.made)]));
  renderVs();
  impFromHash();
  window.addEventListener('hashchange', impFromHash);
  $('b_load').addEventListener('click', load);
  keyEl.addEventListener('keydown', function (e) { if (e.key === 'Enter') load(); });
  $('b_sample').addEventListener('click', sample);
  remEl.addEventListener('change', function () { if (!remEl.checked) store.set('key', null); });
  $('theme').addEventListener('click', function () { dark = dark === 'dark' ? 'light' : 'dark'; store.set('theme', dark); applyTheme(); });
  [['f_kb', 'keepBadges'], ['f_gap', 'bestGap']].forEach(function (f) {
    $(f[0]).addEventListener('change', function () {
      var v = numOr($(f[0]).value);
      S.inputs[f[1]] = v === null ? PVP_DEFAULTS[f[1]] : Math.max(0, v);
      saveInputs(); render();
    });
  });
})();
</script>
</body>
